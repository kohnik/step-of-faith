<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ece7d2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#241b26" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Шаг веры 2026" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Шаг веры 2026</title>
    <script>
      // Тема из параметров запуска Telegram - ещё до загрузки приложения, чтобы в тёмном Telegram не мигала светлая заставка.
      try {
        var tp = new URLSearchParams(location.hash.slice(1)).get('tgWebAppThemeParams');
        var bg = tp && JSON.parse(tp).bg_color;
        if (bg) {
          var n = parseInt(bg.slice(1), 16);
          var lum = 0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255);
          document.documentElement.dataset.theme = lum < 128 ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <style>
      /* Только html: фон body с «зерном» задаёт styles.css (стили отсюда перебили бы его). */
      html {
        background: #ece7d2;
      }
      body {
        margin: 0;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #241b26;
        }
      }
      html[data-theme='dark'] {
        background: #241b26;
      }
      .boot-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .boot-splash i {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(208, 53, 44, 0.2);
        border-top-color: #d0352c;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-splash"><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
