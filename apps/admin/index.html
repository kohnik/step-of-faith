<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: iOS не зумит страницу при фокусе на поле (щипком масштабировать можно). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Админка · Шаг веры 2026</title>
    <script>
      // Тема до загрузки React, чтобы не мигало светлым в тёмной теме.
      try {
        var v = localStorage.getItem('mantine-color-scheme-value');
        var s = v === 'light' || v === 'dark' ? v : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-mantine-color-scheme', s);
      } catch (e) {}
      // Название конференции - последнее известное (его запоминает админка после входа).
      try {
        var n = JSON.parse(localStorage.getItem('sof.admin.event.name') || 'null');
        if (typeof n === 'string' && n) document.title = 'Админка · ' + n;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
