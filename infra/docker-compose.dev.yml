# Локальная разработка: только PostgreSQL. API, бот и фронтенды запускаются через pnpm.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sof
      POSTGRES_PASSWORD: sof
      POSTGRES_DB: sof
    ports:
      - '${SOF_PG_PORT:-55432}:5432'
    volumes:
      - sof-dev-pg:/var/lib/postgresql/data
volumes:
  sof-dev-pg:
