<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шаг веры 2026</title>
  <meta name="description" content="Регистрация на конференцию «Шаг веры 2026» в Telegram">
  <style>
    :root { --bg: #f7f7f5; --fg: #111827; --muted: #6b7280; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --fg: #f3f4f6; --muted: #9ca3af; --accent: #60a5fa; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(32px, 8vw, 52px); line-height: 1.1; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a.btn { display: inline-block; padding: 14px 26px; border-radius: 12px; background: var(--accent); color: #fff;
      text-decoration: none; font-weight: 600; }
    small { display: block; margin-top: 18px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Шаг веры 2026</h1>
    <p>Регистрация, QR-код для входа и расписание - в Telegram-боте. Можно сразу записать всю семью или друзей 🙌</p>
    <a class="btn" href="https://t.me/{{env "BOT_USERNAME"}}?start=reg">Зарегистрироваться в Telegram</a>
    <small>@{{env "BOT_USERNAME"}}</small>
  </main>
</body>
</html>
